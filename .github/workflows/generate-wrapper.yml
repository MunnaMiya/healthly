name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle and generate wrapper
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.6.1"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          mkdir -p /tmp/gradle-dist
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist

          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle \
            wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

      - name: Package wrapper files
        run: |
          mkdir -p wrapper-output/gradle/wrapper

          cp gradlew wrapper-output/
          cp gradle/wrapper/gradle-wrapper.jar wrapper-output/gradle/wrapper/
          cp gradle/wrapper/gradle-wrapper.properties wrapper-output/gradle/wrapper/

      - name: Upload wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: wrapper-output/
